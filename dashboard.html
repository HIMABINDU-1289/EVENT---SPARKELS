<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Event Sparkels - Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(-45deg, #1cb5e0, #000046, #1cb5e0, #000046);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border-radius: 15px;
      padding: 25px 40px;
      margin: 15px;
      text-align: center;
      cursor: pointer;
      font-size: 20px;
      font-weight: bold;
      transition: transform 0.3s ease, background 0.3s;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      color: #fff;
    }

    .card:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.3);
    }

    h1 {
      margin-bottom: 30px;
      font-size: 32px;
    }

    .logout-btn {
      position: absolute;
      top: 20px;
      right: 30px;
      padding: 10px 20px;
      background: #ff1744;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .logout-btn:hover {
      background: #d50000;
    }

    .emoji {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .bg-img {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 80px;
    }

    /* Settings Panel */
    .settings-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 250px;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 20px;
      transform: translateX(100%);
      transition: transform 0.3s ease;
    }

    .settings-panel.open {
      transform: translateX(0);
    }

    .settings-panel h3 {
      margin-top: 0;
      font-size: 22px;
      color: #00c6ff;
    }

    .settings-panel ul {
      list-style-type: none;
      padding: 0;
    }

    .settings-panel ul li {
      margin: 15px 0;
      cursor: pointer;
      font-size: 18px;
      transition: color 0.3s;
    }

    .settings-panel ul li:hover {
      color: #ff1744;
    }

    /* Settings Icon */
    .settings-icon {
      font-size: 40px;
      position: absolute;
      top: 20px;
      left: 30px;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .settings-icon:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <button class="logout-btn" onclick="logout()">Logout</button>

  <div class="emoji">🚀🎭⚽</div>
  <h1>Welcome to Event Sparkels</h1>

  <div class="card" onclick="window.location.href='create-event.html'">➕ Create an Event</div>
  <div class="card" onclick="window.location.href='register-event.html'">📝 Register for Event</div>

  <!-- Settings Icon -->
  <div class="settings-icon" onclick="toggleSettings()">⚙️</div>

  <!-- Settings Panel -->
  <div class="settings-panel" id="settings-panel">
    <h3>Settings</h3>
    <ul>
      <li onclick="alert('Feature 1 Settings')">Change Theme</li>
      <li onclick="alert('Feature 2 Settings')">Change Language</li>
      <li onclick="logout()">Logout</li>
    </ul>
  </div>

  <img class="bg-img" src="copy.jpg" alt="Event Sparkels" />

  <script>
    function logout() {
      localStorage.removeItem("loggedIn");
      window.location.href = "index.html";
    }

    function toggleSettings() {
      const panel = document.getElementById("settings-panel");
      panel.classList.toggle("open");
    }
  </script>
</body>
</html>
